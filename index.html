<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>合宿版 格付けチェック</title>

<style>

/* =========================
   全体
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100vh;
  background: #1b1008;
  color: #fff0bd;
  font-family:
    "Arial Black",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
}


/* =========================
   上部バー
========================= */

.top {
  padding: 8px 12px;

  background: #211207;

  border-bottom: 2px solid #bd913f;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 8px;

  flex-wrap: wrap;
}

.top b {
  font-size: 20px;
}

.top span {
  font:
    12px
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  opacity: 0.8;
}


/* =========================
   ボタン
========================= */

button {

  border: 1px solid #b78a35;

  background:
    linear-gradient(
      #fff1b8,
      #d4a444
    );

  color: #3b210b;

  border-radius: 4px;

  padding: 7px 11px;

  font-weight: bold;

  cursor: pointer;
}

button:hover {
  filter: brightness(1.08);
}


/* =========================
   ステージ
========================= */

.stage {
  padding: 12px;

  overflow: auto;
}


/* =========================
   格付けボード
========================= */

.board {

  min-width: 1080px;

  max-width: 1500px;

  margin: auto;

  padding: 9px;

  border: 2px solid #e7c96f;

  background:
    repeating-linear-gradient(
      0deg,
      #754813 0 2px,
      #bd8726 2px 4px,
      #7e4f15 4px 6px
    );

  box-shadow:
    0 0 0 4px #4b2d0d,
    0 0 25px #000;
}

.inner {

  border: 2px solid #4b2d0d;

  background:
    linear-gradient(
      #edc35a,
      #d9a43b 50%,
      #bd8427
    );
}


/* =========================
   グリッド
========================= */

.grid {

  display: grid;

  grid-template-columns:
    165px
    repeat(6, 1fr);
}


/* =========================
   ヘッダー
========================= */

.header {

  height: 78px;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 3px;

  border-right: 2px solid #865713;

  border-bottom: 3px solid #865713;

  font-weight: 900;

  font-size: 21px;

  line-height: 1.05;

  letter-spacing: -0.05em;
}

.corner {

  background:
    linear-gradient(
      #a66d19,
      #d09a32
    );
}


/* =========================
   各ランクの色
========================= */

.rank1 {

  background: #d6b04b;

  background-image: linear-gradient(
    #fff3a0,
    #ffd700 35%,
    #c98a00 70%,
    #fff0a0
  );

  color: transparent;

  -webkit-background-clip: text;
  background-clip: text;

  text-shadow:
    1px 1px 2px #5a3a00;
}

.rank2 {

  background: #bfc0c2;

  color: #111;

  text-shadow:
    1px 1px #f3f3f3;
}

.rank3 {

  background: #1488bd;

  color: #fff;

  text-shadow:
    1px 1px #064768;
}

.rank4 {

  background: #f4f4f1;

  color: #111;

  text-shadow:
    1px 1px #fff;
}

.rank5 {

  background: #e97837;

  color: #111;

  text-shadow:
    1px 1px #ffc09a;
}

.rank6 {

  background: #080808;

  color: #fff;

  text-shadow:
    1px 1px #000;
}


/* =========================
   ランク名入力
========================= */

.edit {

  width: 95%;

  background: transparent;

  border: 0;

  outline: 0;

  text-align: center;

  font: inherit;

  font-weight: 900;

  color: inherit;

  padding: 4px;
}


/* =========================
   チーム名
========================= */

.rowlabel {

  min-height: 72px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-right: 2px solid #865713;

  border-bottom: 2px solid #865713;

  background:
    linear-gradient(
      90deg,
      #941b15,
      #c42b20,
      #971711
    );
}

.rowlabel input {

  width: 94%;

  background: transparent;

  color: #fff;

  border: 0;

  outline: 0;

  text-align: center;

  font-size: 19px;

  font-weight: 900;

  letter-spacing: -0.04em;
}


/* =========================
   格付けセル
========================= */

.cell {

  min-height: 72px;

  padding: 6px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-right: 2px solid #a97421;

  border-bottom: 2px solid #a97421;

  background:

    linear-gradient(
      rgba(255,238,169,.78),
      rgba(221,177,71,.65)
    ),

    repeating-linear-gradient(
      0deg,
      transparent 0 9px,
      #8e5d19 10px,
      #f1d277 11px
    );
}


/* ドラッグ中 */

.cell.over {

  background: #fff2a8;

  outline:
    4px dashed #b5231d;

  outline-offset: -5px;
}


/* =========================
   チームカード
========================= */

.card {

  width: 94%;

  min-height: 53px;

  padding: 7px 4px;

  border-radius: 3px;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  background:
    linear-gradient(
      #df3a2b,
      #9f1711
    );

  color: #fff;

  border: 2px solid #6d100d;

  box-shadow:
    0 2px 4px #0009;

  font-size: 19px;

  font-weight: 900;

  letter-spacing: -0.04em;

  cursor: grab;

  user-select: none;
}

.card:active {
  cursor: grabbing;
}


/* =========================
   説明
========================= */

.help {

  max-width: 1500px;

  margin: 10px auto 0;

  padding: 10px 13px;

  background: #fff5ce;

  color: #3e260d;

  border: 2px solid #a8792b;

  border-radius: 5px;

  font:
    14px
    "Yu Gothic",
    "Meiryo",
    sans-serif;
}

.help b {
  color: #8d1610;
}


/* =========================
   Firebase接続状態
========================= */

.status {

  font:
    12px
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  margin-left: 8px;
}

.online {
  color: #9cff9c;
}

.offline {
  color: #ffb0a0;
}


/* =========================
   表示モード
========================= */

body.viewer .adminOnly {
  display: none !important;
}

.viewer .header .edit {
  pointer-events: none;
}


/* =========================
   スマホ
========================= */

@media (max-width: 900px) {

  .board {
    min-width: 900px;
  }

  .header {
    font-size: 17px;
  }

  .rowlabel input {
    font-size: 16px;
  }

  .card {
    font-size: 16px;
  }

}

</style>

</head>


<body>


<!-- =========================
     上部
========================= -->

<div class="top">

  <div>

    <b>格付けチェック</b>

    <span id="mode"></span>

    <span
      id="status"
      class="status"
    >
      接続準備中…
    </span>

  </div>


  <div class="adminOnly">

    <button onclick="resetAll()">
      初期状態
    </button>

    <button onclick="fullscreen()">
      全画面
    </button>

  </div>

</div>



<!-- =========================
     ボード
========================= -->

<div class="stage">

  <div class="board">

    <div class="inner">

      <div
        class="grid"
        id="headers"
      ></div>

      <div id="rows"></div>

    </div>

  </div>


  <!-- 説明 -->

  <div class="help">

    <b>表示用URL：</b>

    このページのURLに

    <b>?view=1</b>

    を付けると、

    編集できない

    「観客・プロジェクター表示」

    になります。

    <br>

    管理者側で変更すると、

    Firebase経由で

    同じ画面にリアルタイム反映されます。

    <br>

    <span>
      ※Firebase設定が未入力の場合は、
      この端末内だけで動くローカルモードになります。
    </span>

  </div>

</div>



<!-- =========================
     JavaScript
========================= -->

<script type="module">


/* =========================
   Firebase読み込み
========================= */

import {
  initializeApp
} from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue,
  set
} from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";



/* =========================
   初期データ
========================= */

const defaultRanks = [

  "一流芸能人",

  "普通芸能人",

  "二流芸能人",

  "三流芸能人",

  "そっくりさん",

  "映す価値なし"

];


const defaultTeams = [

  "チームA",

  "チームB",

  "チームC",

  "チームD",

  "チームE",

  "チームF"

];



/* =========================
   ローカル保存用
========================= */

const localKey =
  "kakuzukeLocal";



/* =========================
   現在の状態
========================= */

let state = {

  ranks: [
    ...defaultRanks
  ],

  teams:
    defaultTeams.map(name => ({

      name: name,

      rank: 0

    }))

};



/* =========================
   表示モード判定
========================= */

const viewer =
  new URLSearchParams(
    location.search
  ).get("view") === "1";


if (viewer) {

  document.body.classList.add(
    "viewer"
  );

}


document.getElementById(
  "mode"
).textContent =
  viewer
    ? "　【表示モード】"
    : "　【管理モード】";



/* =========================
   ローカルデータ読み込み
========================= */

function loadLocal() {

  try {

    const x =
      JSON.parse(
        localStorage.getItem(
          localKey
        )
      );


    if (

      x &&

      Array.isArray(x.ranks) &&

      x.ranks.length === 6 &&

      Array.isArray(x.teams) &&

      x.teams.length === 6

    ) {

      state = x;

    }

  }

  catch (e) {

    console.error(
      "ローカルデータ読み込みエラー:",
      e
    );

  }

}



/* =========================
   ローカル保存
========================= */

function saveLocal() {

  try {

    localStorage.setItem(

      localKey,

      JSON.stringify(state)

    );

  }

  catch (e) {

    console.error(
      "ローカル保存エラー:",
      e
    );

  }

}



/* =========================
   HTMLエスケープ
========================= */

function esc(s) {

  return String(s).replace(

    /[&<>"']/g,

    m => ({

      "&": "&amp;",

      "<": "&lt;",

      ">": "&gt;",

      '"': "&quot;",

      "'": "&#39;"

    }[m])

  );

}



/* =========================
   画面描画
========================= */

function render() {


  /* ----------

     ヘッダー

  ---------- */

  const h =
    document.getElementById(
      "headers"
    );


  h.innerHTML =
    '<div class="header corner">格付け<br>チーム</div>';


  state.ranks.forEach(

    (r, i) => {

      const d =
        document.createElement(
          "div"
        );


      d.className =
        "header rank" +
        (i + 1);


      d.innerHTML =
        '<input class="edit" value="' +
        esc(r) +
        '">';


      const inp =
        d.querySelector(
          "input"
        );


      inp.disabled =
        viewer;


      inp.onchange = () => {

        state.ranks[i] =
          inp.value ||
          defaultRanks[i];


        persist();

      };


      h.appendChild(d);

    }

  );



  /* ----------

     チーム行

  ---------- */

  const rows =
    document.getElementById(
      "rows"
    );


  rows.innerHTML = "";


  state.teams.forEach(

    (team, ti) => {


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "grid";



      /* ----------

         チーム名

      ---------- */

      const label =
        document.createElement(
          "div"
        );


      label.className =
        "rowlabel";


      label.innerHTML =
        '<input value="' +
        esc(team.name) +
        '">';


      const inp =
        label.querySelector(
          "input"
        );


      inp.disabled =
        viewer;


      inp.onchange = () => {

        state.teams[ti].name =
          inp.value ||
          defaultTeams[ti];


        persist();

        render();

      };


      row.appendChild(label);



      /* ----------

         6つの格付け

      ---------- */

      for (
        let ri = 0;
        ri < 6;
        ri++
      ) {


        const cell =
          document.createElement(
            "div"
          );


        cell.className =
          "cell";



        /* ----------

           ドラッグ操作

        ---------- */

        if (!viewer) {


          cell.ondragover =
            e => {

              e.preventDefault();

              cell.classList.add(
                "over"
              );

            };


          cell.ondragleave =
            () => {

              cell.classList.remove(
                "over"
              );

            };


          cell.ondrop =
            e => {

              e.preventDefault();

              cell.classList.remove(
                "over"
              );


              const from =
                Number(
                  e.dataTransfer
                    .getData(
                      "team"
                    )
                );


              if (

                Number.isInteger(
                  from
                ) &&

                from >= 0 &&

                from <
                  state.teams.length

              ) {

                state.teams[
                  from
                ].rank = ri;


                persist();

                render();

              }

            };

        }



        /* ----------

           チームカード表示

        ---------- */

        if (
          team.rank === ri
        ) {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "card";


          card.textContent =
            team.name;


          card.draggable =
            !viewer;



          if (!viewer) {


            /*

              PC：
              ドラッグ開始

            */

            card.ondragstart =
              e => {

                e.dataTransfer.setData(

                  "team",

                  String(ti)

                );

              };



            /*

              クリック：
              移動先を選択

            */

            card.onclick = () => {


              const a =
                prompt(

                  "移動先（1～6）\n\n" +

                  state.ranks

                    .map(
                      (x, i) =>
                        (i + 1) +
                        "：" +
                        x
                    )

                    .join(
                      "\n"
                    ),

                  String(
                    team.rank + 1
                  )

                );


              if (
                a === null
              ) {

                return;

              }


              const n =
                Number(a);


              if (
                n >= 1 &&
                n <= 6
              ) {

                state.teams[
                  ti
                ].rank = n - 1;


                persist();

                render();

              }

            };

          }


          cell.appendChild(
            card
          );

        }


        row.appendChild(
          cell
        );

      }


      rows.appendChild(
        row
      );

    }

  );

}



/* =========================
   データ保存
========================= */

function persist() {


  /*

    まず端末にも保存

  */

  saveLocal();



  /*

    Firebaseにも保存

  */

  if (
    window.cloudSet
  ) {

    window.cloudSet(
      state
    );

  }

}



/* =========================
   初期状態に戻す
========================= */

function resetAll() {


  if (
    !confirm(
      "すべて初期状態に戻しますか？"
    )
  ) {

    return;

  }


  state = {

    ranks: [
      ...defaultRanks
    ],

    teams:
      defaultTeams.map(
        name => ({

          name: name,

          rank: 0

        })
      )

  };


  persist();

  render();

}



/* =========================
   全画面
========================= */

function fullscreen() {


  if (
    document.fullscreenElement
  ) {

    document.exitFullscreen();

  }

  else {

    document
      .documentElement
      .requestFullscreen?.();

  }

}



/* =========================
   HTMLのonclickから
   呼び出せるようにする
========================= */

window.resetAll =
  resetAll;

window.fullscreen =
  fullscreen;



/* =========================
   Firebase設定
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDAn8Um6TZO0AiVLhAhEkt9ll8YtpB1Vvw",

  authDomain:
    "kakuzuke1-ce892.firebaseapp.com",

  databaseURL:
    "https://kakuzuke1-ce892-default-rtdb.firebaseio.com",

  projectId:
    "kakuzuke1-ce892",

  storageBucket:
    "kakuzuke1-ce892.firebasestorage.app",

  messagingSenderId:
    "356998921410",

  appId:
    "1:356998921410:web:0304ff77d064a75eed4f5b",

  measurementId:
    "G-9K5S6ZH0WK"

};



/* =========================
   Firebase初期化
========================= */

let app = null;

let db = null;

let boardRef = null;


try {


  app =
    initializeApp(
      firebaseConfig
    );


  db =
    getDatabase(app);


  boardRef =
    ref(
      db,
      "kakuzuke/board"
    );



  /* =========================
     Firebaseへ保存
  ========================= */

  window.cloudSet =
    data => {


      set(
        boardRef,
        data
      )

      .then(() => {

        console.log(
          "Firebase保存成功"
        );

      })

      .catch(error => {

        console.error(
          "Firebase保存エラー:",
          error
        );


        document.getElementById(
          "status"
        ).textContent =
          "保存エラー";


        document.getElementById(
          "status"
        ).className =
          "status offline";

      });

    };



  /* =========================
     Firebaseリアルタイム監視
  ========================= */

  onValue(

    boardRef,

    snapshot => {


      const data =
        snapshot.val();



      /*

        Firebaseにデータが
        すでにある場合

      */

      if (

        data &&

        Array.isArray(
          data.ranks
        ) &&

        data.ranks.length === 6 &&

        Array.isArray(
          data.teams
        ) &&

        data.teams.length === 6

      ) {


        state =
          data;


        saveLocal();

        render();

      }


      /*

        Firebaseが空の場合

        初期状態を書き込む

      */

      else {


        set(
          boardRef,
          state
        )

        .then(() => {

          console.log(
            "Firebaseに初期状態を保存しました"
          );

        })

        .catch(error => {

          console.error(
            "初期データ保存エラー:",
            error
          );

        });

      }



      /*

        接続状態

      */

      document.getElementById(
        "status"
      ).textContent =
        "リアルタイム接続中";


      document.getElementById(
        "status"
      ).className =
        "status online";

    },


    error => {


      console.error(
        "Firebase接続エラー:",
        error
      );


      document.getElementById(
        "status"
      ).textContent =
        "接続エラー";


      document.getElementById(
        "status"
      ).className =
        "status offline";

    }

  );


}

catch (error) {


  console.error(
    "Firebase初期化エラー:",
    error
  );


  document.getElementById(
    "status"
  ).textContent =
    "Firebaseエラー";


  document.getElementById(
    "status"
  ).className =
    "status offline";

}



/* =========================
   最初の画面表示
========================= */

loadLocal();

render();


</script>

</body>

</html>
